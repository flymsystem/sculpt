  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sculpt-theme');
        var t = (saved === 'light') ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        window.__sculptTheme = t;

  <style>

  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app.js"></script>
  <script>
  /* ── Service Worker registration ──────────────────────────────
     Single reload path (controllerchange), guarded by sessionStorage
     to prevent reload loops. Update check happens ONLY on visibility
     return, not on every page load — avoids reload storms.
  ─────────────────────────────────────────────────────────────── */
  (function () {
    if (!('serviceWorker' in navigator)) return;

    var swReg = null;
    var updateReadyPrompted = false;

    function promptForUpdate(reg) {
      if (updateReadyPrompted) return;
      if (!reg || !reg.waiting) return;
      // Non-blocking: apply the update if the tab is idle.
      // We do NOT interrupt mid-modal or mid-form.
      var modalOpen = !!document.getElementById('sculpt-modal-overlay');
      var inputFocused = document.activeElement &&
        ['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) !== -1;
      if (modalOpen || inputFocused) return;
      updateReadyPrompted = true;
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }

    var baseUrl = '%BASE_URL%';
    var appBase = new URL(baseUrl, window.location.origin);
    var swUrl = new URL('sw.js', appBase).href;

    navigator.serviceWorker.register(swUrl).then(function (reg) {
      swReg = reg;

      // If a waiting SW is already there on load, try to activate it
      if (reg.waiting) setTimeout(function(){ promptForUpdate(reg); }, 1500);

      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            // Update is ready — try to apply when user is idle
            setTimeout(function(){ promptForUpdate(reg); }, 1500);
          }
        });
      });
    }).catch(function () { /* silent */ });

    // Single reload trigger — guarded against loops
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      try {
        var flag = sessionStorage.getItem('sculpt-sw-reloading');
        if (flag === '1') return;
        sessionStorage.setItem('sculpt-sw-reloading', '1');
      } catch (_) {}
      window.location.reload();
    });

    // Clear the reload flag once the page is fully loaded post-reload
    window.addEventListener('load', function () {
      try { sessionStorage.removeItem('sculpt-sw-reloading'); } catch (_) {}
    });

    // Check for updates ONLY when the tab becomes visible (not on every load)
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && swReg) {
        swReg.update().catch(function(){});
      }
    });
  })();
  </script>
</body>
</html>
