<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Accessibility: allow pinch-zoom (WCAG 1.4.4). viewport-fit=cover for iOS safe-area. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="D Sculpt Fitness">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- SEO
       HANDOVER: the following still need real values from the client —
         · the live domain, for <link rel="canonical">, og:url and og:image
         · the city/area, to append to the title and description
         · a social share image (1200x630) once photography exists
       canonical/og:url/og:image are deliberately ABSENT rather than guessed:
       a wrong canonical URL actively harms search ranking. -->
  <title>D Sculpt Fitness</title>
  <meta name="description" content="D Sculpt Fitness — strength training, personal coaching and group classes. Come train with us.">
  <meta name="keywords" content="gym, fitness centre, strength training, personal training, group classes, weight training, D Sculpt Fitness">
  <meta name="author" content="D Sculpt Fitness">
  <meta name="robots" content="index, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%icon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%icon-96.png">
  <link rel="manifest" href="%BASE_URL%manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png">

  <!-- Theme color (mobile chrome) -->
  <meta name="theme-color" content="#050507" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

  <!-- Open Graph -->
  <meta property="og:title" content="D Sculpt Fitness">
  <meta property="og:description" content="Strength training, personal coaching and group classes. Come train with us.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="D Sculpt Fitness">
  <meta property="og:locale" content="en_IN">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="D Sculpt Fitness">
  <meta name="twitter:description" content="Strength training, personal coaching and group classes.">

  <!-- Structured Data (JSON-LD)
       HANDOVER: add "address", "telephone", "geo" and
       "openingHoursSpecification" once the client supplies them. They are
       omitted rather than stubbed — publishing invented location data to
       search engines is worse than publishing none. -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HealthClub",
    "name": "D Sculpt Fitness",
    "description": "Strength training, personal coaching and group classes.",
    "currenciesAccepted": "INR"
  }
  </script>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">


  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sculpt-theme');
        var t = (saved === 'light') ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        window.__sculptTheme = t;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    html[data-theme="dark"]  { background: #050507; }
    html[data-theme="light"] { background: #FFFFFF; }
    body                     { margin: 0; }
    #root                    { min-height: 100vh; min-height: 100dvh; width: 100%; overflow-x: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app.js"></script>
  <script>
  /* ── Service Worker registration ──────────────────────────────
     Single reload path (controllerchange), guarded by sessionStorage
     to prevent reload loops. Update check happens ONLY on visibility
     return, not on every page load — avoids reload storms.
  ─────────────────────────────────────────────────────────────── */
  (function () {
    if (!('serviceWorker' in navigator)) return;

    var swReg = null;
    var updateReadyPrompted = false;

    function promptForUpdate(reg) {
      if (updateReadyPrompted) return;
      if (!reg || !reg.waiting) return;
      // Non-blocking: apply the update if the tab is idle.
      // We do NOT interrupt mid-modal or mid-form.
      var modalOpen = !!document.getElementById('sculpt-modal-overlay');
      var inputFocused = document.activeElement &&
        ['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) !== -1;
      if (modalOpen || inputFocused) return;
      updateReadyPrompted = true;
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }

    var baseUrl = '%BASE_URL%';
    var appBase = new URL(baseUrl, window.location.origin);
    var swUrl = new URL('sw.js', appBase).href;

    navigator.serviceWorker.register(swUrl).then(function (reg) {
      swReg = reg;

      // If a waiting SW is already there on load, try to activate it
      if (reg.waiting) setTimeout(function(){ promptForUpdate(reg); }, 1500);

      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            // Update is ready — try to apply when user is idle
            setTimeout(function(){ promptForUpdate(reg); }, 1500);
          }
        });
      });
    }).catch(function () { /* silent */ });

    // Single reload trigger — guarded against loops
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      try {
        var flag = sessionStorage.getItem('sculpt-sw-reloading');
        if (flag === '1') return;
        sessionStorage.setItem('sculpt-sw-reloading', '1');
      } catch (_) {}
      window.location.reload();
    });

    // Clear the reload flag once the page is fully loaded post-reload
    window.addEventListener('load', function () {
      try { sessionStorage.removeItem('sculpt-sw-reloading'); } catch (_) {}
    });

    // Check for updates ONLY when the tab becomes visible (not on every load)
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && swReg) {
        swReg.update().catch(function(){});
      }
    });
  })();
  </script>
</body>
</html>
